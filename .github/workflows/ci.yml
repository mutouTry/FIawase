#
# What runs without a PDK and without a commercial simulator: the wrapper
# elaborates, and the regressions of tests/ and fpga/tests/ pass. tests/ holds
# the load-bearing invariant: the freeze gate masks exactly the L clock edges
# the scan chain gains, so the DUT is restored after an injection.
name: gate-equivalence

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  freeze-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Icarus Verilog
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog
          iverilog -V | head -1

      - name: Elaborate the FI wrapper
        run: iverilog -g2012 -o /dev/null -I tests -I rtl -s fi_wrapper_top rtl/*.v

      - name: Wrapper regressions
        run: sh tests/run.sh

      - name: FPGA host UART
        run: sh fpga/tests/run.sh
