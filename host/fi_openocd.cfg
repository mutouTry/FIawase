# ============================================================
# OpenOCD entry point for an FI campaign against the simulated SoC.
#
#   make            # in the DUT's simulation directory: start the simulator
#   make openocd    # a second shell
#   telnet localhost 4444
#
# `make openocd` is
#   openocd -c "set FI_CFG <dir>/fi_scan_cfg.tcl" -f host/fi_openocd.cfg
# with the fi_scan_cfg.tcl synthesis wrote next to the simulated netlist.
#
# This file is self-bootstrapping: it brings up the TAP and the target and
# then sources the FI procs, so the telnet session can call
# fi_campaign straight away.
#
# The "JTAG adapter" is the simulation itself: jtagdpi in the testbench
# exposes a TCP socket speaking the remote_bitbang protocol.
# ============================================================

if {![info exists FI_CFG]} {
    error "FIawase: FI_CFG is not set. Run `make openocd` in the simulation directory, or\
           openocd -c \"set FI_CFG <netlist dir>/fi_scan_cfg.tcl\" -f host/fi_openocd.cfg"
}

# ---- adapter -----------------------------------------------------------
# OpenOCD renamed all four of these commands in 0.11. Try the modern name
# first and fall back to the old one, so this file works both on 0.10
# and on current releases.
if {[catch {adapter driver remote_bitbang}]} { interface remote_bitbang }
if {[catch {adapter speed 1000}]}            { adapter_khz 1000 }
if {[catch {remote_bitbang port 44853}]}     { remote_bitbang_port 44853 }
if {[catch {remote_bitbang host localhost}]} { remote_bitbang_host localhost }
# The port must match jtagdpi's listening port in the testbench.

# ---- TAP and target ----------------------------------------------------
# Only ONE tap is declared even though the design contains two. The FI
# Transporter deliberately mirrors the RISC-V DTM contract (irlen 5,
# IDCODE=0x01, DTMCS=0x10, DMI=0x11) so the FI cutover needs no OpenOCD
# reconfiguration: after cutover the same tap name reaches the wrapper
# instead of the DUT, and only the IDCODE changes.
#   before cutover  0x1e200a6f   the example DUT's own TAP (CPUTAPID)
#   after  cutover  0xf17e0007   the FI wrapper TAP
# `fi_idcode` reads it back; that is the reliable cutover check.
if { [info exists CHIPNAME] } {
   set _CHIPNAME $CHIPNAME
} else {
   set _CHIPNAME riscv
}

if { [info exists CPUTAPID ] } {
   set _CPUTAPID $CPUTAPID
} else {
   set _CPUTAPID 0x1e200a6f
}
# The DUT TAP's IR length; the FI Transporter shares the same IR shift
# (FI_JTAG_IR_BITS in rtl/fi_transporter.v must match).
if { ![info exists FI_IRLEN] } { set FI_IRLEN 5 }

# FI_DUT_TARGET 1 (the default) also creates a riscv target for the DUT and
# halts it, for debugging the DUT through the same session. The FI path
# itself needs only irscan/drscan, so with FI_DUT_TARGET 0 OpenOCD runs the
# chain alone: then it does not matter which debug-spec version the DUT's
# debug module implements, or whether this OpenOCD supports it.
#     openocd -c "set FI_DUT_TARGET 0" -c "set CPUTAPID 0" -f host/fi_openocd.cfg
# CPUTAPID 0 accepts any IDCODE.
if { ![info exists FI_DUT_TARGET] } { set FI_DUT_TARGET 1 }

if { $_CPUTAPID == 0 } {
   jtag newtap $_CHIPNAME tap -irlen $FI_IRLEN
} else {
   jtag newtap $_CHIPNAME tap -irlen $FI_IRLEN -expected-id $_CPUTAPID
}
set _TARGETNAME $_CHIPNAME.tap

if { $FI_DUT_TARGET } {
   target create $_TARGETNAME riscv -chain-position $_TARGETNAME

   # Work area for OpenOCD's download algorithms. Unused by the FI path, which
   # only reads and writes DMI registers -- but point it at real scratch RAM
   # before you rely on any OpenOCD flash/memory command. On the example SoC
   # 0x00000000 is ROM, not RAM (RAM is at 0x20000000).
   $_TARGETNAME configure -work-area-phys 0x00000000 -work-area-size 1000 -work-area-backup 0

   # Prefer system bus access: it does not disturb the core, which matters
   # when the DUT is mid-campaign.
   riscv set_prefer_sba on

   # Simulation is orders of magnitude slower than silicon.
   riscv set_command_timeout_sec 10
   riscv set_reset_timeout_sec 1
}

init
if { $FI_DUT_TARGET } { halt }

# ---- FI procs ----------------------------------------------------------
# Sourced AFTER init on purpose: these issue JTAG transactions, so the
# queue has to be up. Sourcing them here is what makes a bare telnet
# session usable with no further setup.
source [file join [file dirname [info script]] tapename.tcl]
source [file join [file dirname [info script]] inject_and_run_dmi.tcl]

echo "FIawase: FI procs loaded. Run 'poll off' first, then:"
echo "  fi_campaign {{<cycle> {<FI_Index> ...}} ...}   load and arm a campaign"
echo "  fi_mbu <cycle> {<FI_Index> ...}                one multi-bit upset"
echo "  fi_idcode                                      which TAP owns TDO now"
echo "  fi_status_dump                                 read FI_STATUS + config"
echo "e.g.  fi_campaign { {30000 {37}} {90000 {37 38 39}} }"
