# OpenOCD configuration for the FIawase wrapper on the example board, a Genesys2 (written for
# OpenOCD 0.10).
#
# Adapter: J17's FT2232H. Port 0 (A) is wired to PROG_D0..7 (Digilent's DPTI bus; the FT2232H
# has its synchronous FIFO only on port A), which the bitstream uses as the host JTAG (MPSSE: D0
# TCK, D1 TDI, D2 TDO, D3 TMS). Port 1 (B) is the FPGA's own configuration JTAG (Vivado's hardware
# manager). FI_FTDI_CHANNEL selects the port, 0 by default. Only the
# four JTAG pins are driven (PROG_D4 is left alone).
#
# Chain: one TAP with a 5-bit IR. Before the FI cutover it is the DUT's own TAP (the wrapper is
# transparent), after it the wrapper's (IDCODE 0xF17E0007). No riscv target is created and the DUT
# is never halted: the FI procs drive the TAP directly, and the DUT's first run stays undisturbed.

# the FI procs (fi_campaign, fi_status_dump, fi_idcode, ...): FIAWASE_HOST is FIawase's host/ directory
if { ![info exists FIAWASE_HOST] } {
    error "set FIAWASE_HOST to FIawase's host/ directory (board_campaign.py does)"
}

interface ftdi
ftdi_vid_pid 0x0403 0x6010
if { ![info exists FI_FTDI_CHANNEL] } { set FI_FTDI_CHANNEL 0 }
ftdi_channel $FI_FTDI_CHANNEL
if { ![info exists FI_ADAPTER_KHZ] } { set FI_ADAPTER_KHZ 1000 }
adapter_khz $FI_ADAPTER_KHZ
transport select jtag
ftdi_layout_init 0x0008 0x000b

if { ![info exists FI_IRLEN] }  { set FI_IRLEN 5 }
if { ![info exists CPUTAPID] }  { set CPUTAPID 0 }
if { $CPUTAPID == 0 } {
    jtag newtap riscv tap -irlen $FI_IRLEN
} else {
    jtag newtap riscv tap -irlen $FI_IRLEN -expected-id $CPUTAPID
}

init

source [file join $FIAWASE_HOST tapename.tcl]
source [file join $FIAWASE_HOST inject_and_run_dmi.tcl]
echo "FIawase board: FI procs loaded (fi_campaign, fi_status_dump, fi_idcode)"
